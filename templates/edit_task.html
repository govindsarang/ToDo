<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django ToDo-App - Edit Task</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===== BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== EDIT CARD ===== */
        .edit-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 42px 40px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.18);
            width: 100%;
            max-width: 560px;
        }

        /* ===== ICON CIRCLE ===== */
        .icon-circle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icon-circle i {
            color: #fff;
            font-size: 1.6rem;
        }

        /* ===== HEADING ===== */
        .edit-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d2d4e;
            text-align: center;
            margin-bottom: 6px;
        }

        .edit-subtitle {
            font-size: 0.85rem;
            color: #999;
            text-align: center;
            margin-bottom: 30px;
        }

        /* ===== INPUT ===== */
        .task-input {
            width: 100%;
            padding: 13px 18px;
            border: 2px solid #d0d5ee;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            color: #2d2d4e;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 18px;
        }

        .task-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* ===== BUTTONS ===== */
        .btn-row {
            display: flex;
            gap: 12px;
        }

        .btn-update {
            flex: 1;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }

        .btn-update:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-cancel {
            flex: 1;
            background: #f0f2f5;
            color: #555;
            border: 2px solid #d8dce8;
            border-radius: 10px;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .btn-cancel:hover {
            background-color: #e4e6ee;
            color: #333;
            text-decoration: none;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="edit-card">
        <!-- Icon -->
        <div class="icon-circle">
            <i class="fa fa-pencil"></i>
        </div>

        <!-- Title -->
        <h2 class="edit-title">Edit Task</h2>
        <p class="edit-subtitle">Update your task below and click Save.</p>

        <!-- Form — action, method, csrf and name attribute UNCHANGED -->
        <form action="{% url 'edit_task' get_task.pk %}" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <input
                    type="text"
                    name="task"
                    class="task-input"
                    placeholder="Edit your task..."
                    value="{{ get_task.task }}"
                    required
                >
                <div class="btn-row">
                    <a href="{% url 'home' %}" class="btn-cancel">
                        <i class="fa fa-arrow-left"></i> Cancel
                    </a>
                    <button type="submit" class="btn-update">
                        <i class="fa fa-save"></i> Save Changes
                    </button>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
